_schema-version: 3.3.0
ID: LearningCAP01
description: A simple CAP project.
version: 1.0.0
modules:
- name: LearningCAP01-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: LearningCAP01-auth
  - name: LearningCAP01-db
  - name: LearningCAP01-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: LearningCAP01-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: LearningCAP01-db
  parameters:
    buildpack: nodejs_buildpack
- name: LearningCAP01-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: LearningCAP01-auth
  - name: srv-api
  - name: LearningCAP01-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - bookshop.zip
      name: LearningCAP01bookshop
      target-path: app/
    - artifacts:
      - bookshopbasic.zip
      name: bookshopbasic
      target-path: app/
- name: LearningCAP01bookshop
  type: html5
  path: app/bookshop
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: bookshopbasic
  type: html5
  path: app/book_shop_basic
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: LearningCAP01-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: LearningCAP01-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: LearningCAP01-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: LearningCAP01-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
- name: LearningCAP01-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
